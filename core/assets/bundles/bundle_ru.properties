setting.alwaysmusic.name = Всегда играть музыку

setting.alwaysmusic.description = Если включить эту функцию, музыка всегда будет воспроизводиться в игре по кругу.\nЕсли выключить, она будет воспроизводиться только через случайные промежутки времени.
setting.skipcoreanimation.name = Пропускать анимацию запуска/приземления ядра
setting.skipcoreanimation.description = Когда включено, анимации запуска и приземления ядра будут пропущены.
setting.landscape.name = Только альбомный (горизонтальный) режим
setting.shadows.name = Тени
setting.lineartext.name = Сглаживание текста
setting.landscape.description = Когда включено, ориентация экрана всегда будет в альбомном режиме.
setting.blockreplace.name = Автоматическая замена блоков
setting.blockreplace.description = Когда включено, размещение блока такого же типа на другом блоке\nпредложит его заменить.
setting.linear.name = Линейная фильтрация
setting.linear.description = Когда включено, сглаживает текстуры в игре.
setting.hints.name = Подсказки
setting.backgroundpause.name = Фоновая пауза
setting.backgroundpause.description = Когда включено, игра будет поставлена на паузу, если открыто другое окно.
setting.buildautopause.name = Автоматическая приостановка строительства
setting.buildautopause.description = Когда включено, строительство новых блоков не начнётся\nдо нажатия кнопки продолжения строительства.
setting.doubletapmine.name = Добыча руды двойным нажатием
setting.doubletapmine.description = Если включено, для добычи руды на неё надо будет нажать дважды.
setting.commandmodehold.name = Удерживать для командования боевыми единицами
setting.commandmodehold.description = Если включено, режим командования активируется при удерживании кнопки командования,\nвместо простого нажатия.
setting.distinctcontrolgroups.name = Ограничение на одну группу управления на единицу 
setting.distinctcontrolgroups.description = Когда включено, одна боевая еденица может быть только в одной группе управления.
setting.modcrashdisable.name = Отключение модификаций после вылета при запуске
setting.modcrashdisable.description = Когда включено, если игра вылетает во время запуска, все модификации\nбудут автоматически выключены во избежание цикличных вылетов.
setting.animatedwater.name = Анимированные поверхности
setting.animatedwater.description = Показывает анимации поверхностей жидкостей и щитов в игре.
setting.playerindicators.name = Индикаторы направления игроков
setting.playerindicators.description = Показывает индикаторы, показывающие направление к другим игрокам на карте.
setting.showpings.name = Показывать отметки
setting.showotherbuildplans.name = Показывать планы строительства других игроков
setting.indicators.name = Индикаторы направления врагов
setting.indicators.description = Показывает индикаторы, показывающие направление к вражеским боевым единицам.
setting.autotarget.name = Автозахват цели
setting.autotarget.description = Когда включено, ваша боевая единица будет автоматически выбирать и атаковать цель.
setting.keyboard.name = Мышь+Управление с клавиатуры
setting.fpscap.name = Максимальный FPS
setting.fpscap.description = Устанавливает максимальную частоту кадров в игре.\nВысокие значения могут повысить энергопотребление устройства.
setting.fpscap.none = Неограниченный
setting.fpscap.text = {0} FPS
setting.uiscale.name = Масштаб пользовательского интерфейса
setting.uiscale.description = Для вступления изменений в силу может потребоваться перезагрузка игры.
setting.uiEdgePadding.name = Отступ от краев интерфейса
setting.uiEdgePadding.description = Добавляет отступы к краям пользовательского интерфейса. \nПолезно для дисплеев с закругленными углами или выемками.
setting.swapdiagonal.name = Всегда диагональное размещение
setting.swapdiagonal.description = Когда включено, размещение блоков включит диагональный режим.
setting.screenshake.name = Тряска экрана
setting.screenshake.description = Регулирует интенсивность тряски экрана при взрывах, шагах, и т.д.
setting.bloomintensity.name = Интенсивность свечения
setting.bloomintensity.description = Регулирует интенсивность свечения.
setting.bloomblur.name = Размытие свечения
setting.bloomblur.description = Регулирует размытость свечения.
setting.effects.name = Эффекты
setting.effects.description = Переключает отображение визуальных эффектов, таких как дым и пар.
setting.destroyedblocks.name = Отображать уничтоженные блоки
setting.destroyedblocks.description = Когда включено, на месте уничтоженных блоков останется след.
setting.blockstatus.name = Показывать статус блока
setting.blockstatus.description = Показывать цветные иконки статуса над блоками.
setting.conveyorpathfinding.name = Поиск пути для установки конвейеров
setting.conveyorpathfinding.description = Когда включено, размещение конвейеров будет пытаться найти путь к месту назначения.
setting.sensitivity.name = Чувствительность контроллера
setting.sensitivity.description = Регулирует чувствительность контроллера.
setting.saveinterval.name = Интервал автосохранения
setting.saveinterval.description = Регулирует интервал между автоматическими сохранениями.
setting.seconds = {0} секунд
setting.milliseconds = {0} миллисекунд
setting.fullscreen.name = Полноэкранный режим
setting.fps.name = Показывать FPS и пинг
setting.fps.description = Показывает текущую частоту кадров и пинг в углу экрана.
setting.console.name = Включить консоль
setting.console.description = Включает внутриигровую консоль Javascript.
setting.drawhitboxes.name = Отображать хитбоксы
setting.showperformance.name = Отображать метрики производительности
setting.buildingtimestep.name = Фиксированное обновление построек
setting.buildingtimestep.description = Обновляет постройки с фиксированным промежутком и постоянной дельтой, вместо обновления каждый кадр и переменной дельтой.\nЕсли постройки не могут быть обновлены достаточно быстро, игра замедлится.\nЕсли вы не знаете, что это значит, не трогайте эту настройку.
setting.smoothcamera.name = Плавная камера
setting.smoothcamera.description = Когда включено, камера будет плавно двигаться к позиции игрока.
setting.detach-camera.name = Свободная камера
setting.detach-camera.description = При включении, вместо боевой единицы можно будет двигать камеру.\nМожно быстро переключать через горячую клавишу.
setting.vsync.name = Вертикальная синхронизация
setting.vsync.description = Синхронизирует чатоту обновления игры и монитора для\nпредотвращения визуальных разрывов на экране.
setting.pixelate.name = Пикселизация
setting.pixelate.description = Когда включено, в игре накладывается пиксельный шейдер.
setting.minimap.name = Отображать мини-карту
setting.minimap.description = Переключает видимость мини-карты в углу экрана.
setting.coreitems.name = Отображать предметы из ядра
setting.coreitems.description = Показывает хранимые в ядре предметы на верху экрана.
setting.position.name = Отображать координаты игрока
setting.position.description = Показывает координаты игрока на экране.
setting.mouseposition.name = Показывать позицию курсора
setting.mouseposition.description = Показывает координаты курсора мыши на экране.
setting.musicvol.name = Громкость музыки
setting.atmosphere.name = Отображать атмосферу планеты
