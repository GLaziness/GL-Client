lglobal.@blockCount = Общее количество видов блоков в игре; используется операцией поиска
lglobal.@itemCount = Общее количество видов предметов в игре; используется операцией поиска
lglobal.@liquidCount = Общее количество видов жидкости в игре; используется операцией поиска
lglobal.@server = True, если код работает на сервере, иначе False

lglobal.@client = True, если код работает на клиенте, подключённом к серверу
lglobal.@clientLocale = Выбранный язык игры клиента, выполняющего код. Пример: en_US

lglobal.@clientUnit = Боевая единица клиента, выполняющего код
lglobal.@clientName = Имя игрока клиента, выполняющего код
lglobal.@clientTeam = ID команды клиента, выполняющего код.
lglobal.@clientMobile = True, если код работает на мобильном клиенте, иначе False
lglobal.@clientMusicPlaying = True, если в данный момент играет любая музыка
lglobal.@clientCurrentMusic = Название текущей проигрываемой музыки, или null
lenum.type = Тип постройки/единицы. \nНапример, для маршрутизатора это будет [accent]@router[].\nНе строка.

lenum.shoot = Стрельба в определённую позицию.
lenum.shootp = Стрельба в единицу/постройку с расчётом скорости.
lenum.config = Конфигурация постройки, например, предмет сортировки.
lenum.enabled = Включён ли блок.
laccess.currentammotype = Текущий боеприпас турели.

laccess.memorycapacity = Количество слотов в блоке памяти
laccess.color = Цвет осветителя.
laccess.controller = Командующий единицей. Если единица управляется процессором, возвращает процессор. Если в строю, возвращает командующего.\nВ противном случае возвращает саму единицу.
laccess.dead = Является ли единица/постройка неработающей или несуществующей.
laccess.controlled = Возвращает:\n[accent]@ctrlProcessor[] если единица управляется процессором\n[accent]@ctrlPlayer[] если единица/постройка управляется игроком\n[accent]@ctrlFormation[] если единица в строю\nВ противном случае — 0.
laccess.progress = Прогресс действия от 0 до 1. Возвращает прогресс производства, перезарядку турели или прогресс постройки.
laccess.speed = Максимальная скорость единицы, в плитках/сек.
laccess.size = Размер боев. ед./постройки или длина текстового значения.
laccess.id = Идентификатор единицы/блока/предмета/жидкости.\nЭто обратная операция поиска.
laccess.displaywidth = Ширина дисплея, в пикселях.
laccess.displayheight = Высота дисплея, в пикселях.
laccess.buffersize = Количество необработанных команд в графическом буфере дисплея.
laccess.operations = Количество операций, выполненных в блоке.\nДля дисплеев, возвращает количество выполненных операций Вывод рисования/drawflush.
laccess.maxunits = Максимальное количество единиц, которое может быть у команды.\nОпределяется с помощью ядер.
laccess.totalitems = Общее количество предметов внутри.
laccess.firstitem = Первый предмет внутри или null, если пусто.
laccess.totalliquids = Общее количество жидкости внутри.
laccess.totalpower = Для блоков с запасом энергии — сколько энергии запасено; для остальных — заполненность буфера от 0 до 1.
laccess.itemcapacity = Сколько предметов вмещает постройка.
laccess.liquidcapacity = Сколько жидкости вмещает постройка.
laccess.powercapacity = Сколько энергии может запасти постройка.
laccess.powernetstored = Сколько энергии запасено во всей подключённой сети.
laccess.powernetcapacity = Общая ёмкость подключённой энергосети.
laccess.powernetin = Поступление энергии в подключённую сеть в секунду.
laccess.powernetout = Расход энергии из подключённой сети в секунду.
laccess.ammo = Текущий запас боеприпасов турели.
laccess.ammocapacity = Максимальный запас боеприпасов турели.
laccess.health = Текущая прочность.\nДля снарядов — их урон.
laccess.maxhealth = Максимальная прочность.\nДля снарядов — базовый урон.
laccess.heat = Текущий нагрев турели, использующей тепло, от 0 до 1.
laccess.shield = Текущий щит юнита.
laccess.armor = Броня: на столько снижается урон от каждого попадания.
laccess.efficiency = Эффективность работы постройки, 1 — обычная.
laccess.timescale = Множитель скорости времени для постройки, 1 — обычная скорость.
laccess.rotation = Угол поворота юнита или турели в градусах.\nДля большинства других построек — направление от 0 до 3.
laccess.x = Позиция X в клетках.
laccess.y = Позиция Y в клетках.
laccess.velocityx = Скорость юнита по X, клеток/с.
laccess.velocityy = Скорость юнита по Y, клеток/с.
laccess.shootx = Координата X, куда целится юнит или турель.
laccess.shooty = Координата Y, куда целится юнит или турель.
laccess.camerax = Позиция X камеры управляющего игрока.
laccess.cameray = Позиция Y камеры управляющего игрока.
laccess.camerawidth = Ширина обзора управляющего игрока в клетках.
laccess.cameraheight = Высота обзора управляющего игрока в клетках.
laccess.solid = Мешает ли постройка движению.
laccess.range = Дальность юнита или турели в клетках.
laccess.shooting = Стреляет ли сейчас юнит или турель.
laccess.boosting = Летит ли юнит сейчас над местностью (буст).
laccess.minex = Координата X клетки, которую копает юнит, или -1, если не копает.
laccess.miney = Координата Y клетки, которую копает юнит, или -1, если не копает.
laccess.mining = Копает ли сейчас юнит.
laccess.buildx = Координата X клетки, где строит юнит, или -1, если не строит.
laccess.buildy = Координата Y клетки, где строит юнит, или -1, если не строит.
laccess.pingx = Координата X метки игрока или null, если метки нет.
laccess.pingy = Координата Y метки игрока или null, если метки нет.
laccess.pingtext = Текст текущей метки игрока или null, если метки нет.
laccess.building = Постройка, которую сейчас строит юнит, или null.
laccess.breaking = Постройка, которую сейчас разбирает юнит, или null.
laccess.team = ID команды юнита или постройки.
laccess.flag = Числовой флаг юнита.
laccess.flying = Находится ли юнит в воздухе.
laccess.name = Ник игрока, управляющего юнитом, или null.
laccess.payloadcount = Сколько грузов сейчас везёт.
laccess.payloadtype = Тип последнего поднятого груза или null.
laccess.totalpayload = Суммарный размер всех грузов.
laccess.payloadcapacity = Максимальный суммарный размер груза юнита или постройки.
laccess.selectedblock = Блок, выбранный управляющим игроком, или null.
laccess.selectedrotation = Поворот постройки, выбранный управляющим игроком, от 0 до 3.
laccess.bulletlifetime = Полное время жизни снаряда в тиках.
laccess.bullettime = Сколько тиков снаряд уже существует.
lcategory.unknown = Неизвестно

lcategory.unknown.description = Нет категории.
