client.globalchat.gmhelp = [#7fd3ff][[GL][] [lightgray]!gm mute <метка или ник> - мьют на 10 минут, !gm unmute / unban - снять, !gm list - список. Бан в чате этого сервера: !gm sban (7 дней) / sbanforever (навсегда) - модераторы (только на сервере, куда их назначили), кураторы и владелец. Бан во всём чате: !gm ban (7 дней) / ban30 (30 дней) - кураторы и владелец, !gm banforever (навсегда) - владелец. Кураторам ещё доступны !gm addmod <метка> (модератор сервера, на котором вы сейчас) / delmod <метка>, владельцу ещё !gm addcur / delcur <метка>. Снять наказание может только тот, чей ранг не ниже выдавшего.
