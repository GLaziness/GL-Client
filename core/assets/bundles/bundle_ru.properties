client.globalchat.help.hint = Команды и управление
client.globalchat.help = [accent]Команды[]\n[sky]!g текст[] - сообщение в глобальный чат (всем игрокам GL), [sky]!g[] - статус\n[sky]!gs текст[] - сообщение в чат этого сервера (игрокам GL во всех режимах сервера), [sky]!gs[] - статус\n[sky]!ghelp[] - эта справка\n[lightgray]В чате клавишей Tab выбираются режимы !g и !gs: тогда пишешь без команды, как в /t и /a[]\n\n[accent]Окно чата[] (Alt + ЛКМ по карте, «Глобальный чат»)\nВкладки «Сервер» и «Глобальный»; кнопки с сервером и планетой включают и выключают эти чаты\nНажатие на сообщение копирует текст, на его значок - действия с игроком (скопировать метку, наказания)\nКнопка чата - кто в сети; кнопка копирования - твоя метка (её отправляют модератору, чтобы снять наказание)\n\n[accent]Модерация[] (модераторы, кураторы, владелец)\n[sky]!gm mute <метка или ник>[] - мьют на 10 минут, [sky]!gm unmute[], [sky]!gm unban[], [sky]!gm list[]\n[sky]!gm sban[] / [sky]sbanforever[] - бан в чате этого сервера на 7 дней / навсегда\n[sky]!gm ban[] / [sky]ban30[] - бан везде на 7 / 30 дней (кураторы), [sky]!gm banforever[] - навсегда (владелец)\n[sky]!gm addmod[] / [sky]delmod <метка>[] - модератор этого сервера (кураторы), [sky]!gm addcur[] / [sky]delcur <метка>[] - куратор (владелец)
