locales.info = Здесь вы можете добавить на карту наборы локалей для определенных языков. В наборах локалей каждое свойство имеет имя и значение. Эти свойства могут использоваться мировыми процессорами и целями по их именам. Они поддерживают форматирование текста (заменяя пропуски реальными значениями).\n\n[cyan]Пример свойства:\n[]name: [accent]timer[]\nvalue: [accent]Пример таймера, оставшееся время: {0}[]\n\n[cyan]Использование:\n[]Установите его как текст задания: [accent]@timer\n\n[]Введите его в мировом процессоре:\n[accent]localeprint «timer»\nformat time\n[gray] (где time - отдельно вычисляемая переменная)
