sourceSets.main.java.srcDirs = ["src/"]

project.ext.mainClassName = "mindustry.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets")

def JDK_DIR = "$System.env.JDK_DIR"
def ICON_DIR = new File("$rootDir/core/assets/icons/icon.icns")
def platforms = ["Linux64", "Windows64", "MacOS"]

tasks.register('run', JavaExec){
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath + files("../bouncycastle/bcprov-jdk15on.jar", "../bouncycastle/bcpkix-jdk15on.jar", "../bouncycastle/bctls-jdk15on.jar", "../bouncycastle/bcutil-jdk15on.jar", "../fooKotlinScriptSupport.jar")
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    systemProperties += System.properties

    if(System.getProperty("os.name").toLowerCase().contains("mac")){
        jvmArgs += "-XstartOnFirstThread"
    }

    jvmArgs += "-XX:+ShowCodeDetailsInExceptionMessages"

    if(project.hasProperty("args")){
        args += project.property("args")
    }

    if(project.hasProperty("jvmArgs")){
        jvmArgs((List<String>) Eval.me(project.getProperties()["jvmArgs"]))
    }

    if(project.hasProperty("dataDir")){
        environment("MINDUSTRY_DATA_DIR", project.getProperties()["dataDir"])
    }

    if(args.contains("debug")){
        mainClass = "mindustry.debug.DebugLauncher"
    }
}

tasks.register('dist', Jar){
    dependsOn configurations.runtimeClasspath
    mustRunAfter ":tools:pack"
    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from {configurations.runtimeClasspath.collect{
        it.isDirectory() ? it : zipTree(it)
    }}
    from files("../bouncycastle")
    from files(project.assetsDir)
    exclude("sounds/", "music/") // The client downloads these on first launch these days
    exclude("config/**")
    exclude("**hs_err**.log")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    //don't include steam shared libraries unless necessary
    if(!versionModifier.contains("steam")){
        exclude("**steam**.so", "**steam**.dll", "**steam**.dylib")
    }

    archiveFileName = "${appName}.jar"

    manifest{
        attributes 'Main-Class': project.mainClassName
        attributes 'Class-Path': "bcprov-jdk15on.jar bcpkix-jdk15on.jar bctls-jdk15on.jar bcutil-jdk15on.jar fooKotlinScriptSupport.jar"
        //note: this doesn't do anything when launched from the bundled JVM
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
//        attributes 'Multi-Release': 'true' TODO: Anuke added this but it makes kotlin script support implode. The JVM is truly awesome.
    }
}

if(!project.ext.hasSprites() && System.getenv("JITPACK") != "true"){
    println "Scheduling sprite packing."
    run.dependsOn ":tools:pack"
    dist.dependsOn ":tools:pack"
}

// GL: the Steam copy of the game is patched by swapping its jar, the way Foo's client is installed.
def steamJarNames = ["jre/desktop.jar", "desktop.jar", "Mindustry.app/Contents/Resources/desktop.jar"]

def findSteamGame = {
    if(project.hasProperty("steamDir")) return file(project.property("steamDir"))

    def home = System.getProperty("user.home")
    def roots = ["C:/Program Files (x86)/Steam", "C:/Program Files/Steam",
                 "$home/.steam/steam", "$home/.local/share/Steam",
                 "$home/Library/Application Support/Steam"].collect{ new File(it.toString()) }
    if(System.env.STEAM_DIR != null) roots.add(0, new File(System.env.STEAM_DIR))

    def libraries = []
    roots.findAll{ it.isDirectory() }.each{ root ->
        libraries.add(root)
        // other drives are listed in libraryfolders.vdf
        def vdf = new File(root, "steamapps/libraryfolders.vdf")
        if(vdf.isFile()){
            vdf.eachLine("UTF-8"){ line ->
                def m = (line =~ /"path"\s+"(.+)"/)
                if(m.find()) libraries.add(new File(m.group(1).replace("\\\\", "/")))
            }
        }
    }

    for(lib in libraries){
        def game = new File(lib, "steamapps/common/Mindustry")
        if(game.isDirectory()) return game
    }
    return null
}

def steamGameJar = { File game ->
    for(name in steamJarNames){
        def f = new File(game, name)
        if(f.isFile()) return f
    }
    return null
}

/** GL: puts the built client into the Steam copy of the game, keeping a copy of the original jar. */
tasks.register('steamInstall'){
    dependsOn dist
    group = "gl"
    description = "Installs the client into the Steam copy of Mindustry. Build with -Prelease -PversionModifier=steam."

    doLast{
        if(!versionModifier.contains("steam")){
            logger.warn("WARNING: built without -PversionModifier=steam, the Steam native libraries are missing from this jar.")
        }

        def game = findSteamGame()
        if(game == null) throw new GradleException("The Steam copy of Mindustry was not found. Pass the folder: -PsteamDir=\"C:/.../steamapps/common/Mindustry\"")

        def target = steamGameJar(game)
        if(target == null) throw new GradleException("No desktop.jar inside $game - is this really the Steam copy of the game?")

        def backup = new File(target.parentFile, target.name + ".vanilla")
        if(!backup.isFile()){ // only the untouched jar is kept, a second install must not overwrite it
            copy{
                from target
                into target.parentFile
                rename{ target.name + ".vanilla" }
            }
            logger.lifecycle("Original saved as $backup")
        }

        def built = tasks.dist.archiveFile.get().asFile
        copy{
            from built
            into target.parentFile
            rename{ target.name }
        }
        logger.lifecycle("$appName installed into $target - launch the game through Steam as usual.")
        logger.lifecycle("Steam puts its own jar back on every game update and on 'verify integrity of game files'; run this task again after that.")
    }
}

/** GL: puts the original Steam jar back. */
tasks.register('steamRestore'){
    group = "gl"
    description = "Restores the original jar of the Steam copy of Mindustry."

    doLast{
        def game = findSteamGame()
        if(game == null) throw new GradleException("The Steam copy of Mindustry was not found. Pass the folder: -PsteamDir=\"C:/.../steamapps/common/Mindustry\"")

        def target = steamGameJar(game)
        if(target == null) throw new GradleException("No desktop.jar inside $game.")

        def backup = new File(target.parentFile, target.name + ".vanilla")
        if(!backup.isFile()) throw new GradleException("No saved original next to $target - let Steam verify the game files instead.")

        copy{
            from backup
            into target.parentFile
            rename{ target.name }
        }
        backup.delete()
        logger.lifecycle("The original game is back in $target")
    }
}

//this is only for local testing
//add -Prelease -PversionModifier=steam as build properties
tasks.register('steamtest'){
    dependsOn dist
    doLast{
        copy{
            from "build/libs/Mindustry.jar"
            if(project.hasProperty("destination")){
                into project.property("destination")
                rename("Mindustry.jar", "client.jar")
            }else if(System.getProperty("os.name").toLowerCase().contains("mac")){
                into "/Users/nate/Library/Application Support/Steam/steamapps/common/Mindustry/Mindustry.app/Contents/Resources"
                rename("Mindustry.jar", "desktop.jar")
            }
        }
    }
}

//required templates:
//- Windows32: Not provided by Packr! This uses Java 8
//required JDKs:
//- Windows64
//- Linux64
//- Mac
platforms.each{ platform ->
    task "packr${platform.toString()}"{
        dependsOn dist

        doLast{
            copy{
                into "build/packr/"
                rename("${appName}.jar", "desktop.jar")
                from "build/libs/${appName}.jar"
//                from "../bouncycastle"
            }

            delete{
                delete "build/packr/output/"
            }

            def jarPath = JDK_DIR + "packr.jar"
            def args = new String[]{"java", "-jar", jarPath}

            args += new String[]{
                "--platform", platform == "MacOS" ? "Mac" : platform.toString(),
                "--jdk", JDK_DIR + "jre-${platform.toString().toLowerCase()}",
                "--executable", appName,
                "--classpath", "$rootDir/desktop/build/packr/desktop.jar".toString(),
                "--mainclass", project.ext.mainClassName,
                "--verbose",
                "--bundle", getPackage() + ".mac",
                "--icon", ICON_DIR,
                "--output", "$rootDir/desktop/build/packr/output".toString(),
                "--removelibs", "$rootDir/desktop/build/packr/desktop.jar".toString()
            }

            args += "--vmargs"

            if(platform == "MacOS"){
                args += "XstartOnFirstThread"
            }

            args += "Dhttps.protocols=TLSv1.2,TLSv1.1,TLSv1"
            args += "XX:+ShowCodeDetailsInExceptionMessages"
            args += "XX:+UseCompactObjectHeaders"
            args += "enable-native-access=ALL-UNNAMED"

            project.services.get(ExecOperations).exec{
                commandLine args.toList()
                standardOutput = System.out
            }

            def outputJsonFile = platform != "MacOS" ? file("build/packr/output/Mindustry.json") : file("build/packr/output/${appName}.app/Contents/Resources/Mindustry.json")

            if(platform != "MacOS"){
                copy{
                    into "build/packr/output/jre/"
                    from "build/packr/output/desktop.jar"
                }

                delete{
                    delete "build/packr/output/desktop.jar"
                }

                outputJsonFile.text = outputJsonFile.text.replace("desktop.jar", "jre/desktop.jar")
            }else{
                copy{
                    into "build/packr/output/${appName}.app/Contents/"
                    from "build/packr/output/Contents/"
                }

                delete{
                    delete "build/packr/output/Contents/"
                }
            }

            //packr is broken and won't let me add one hyphen, so I have to do that myself later
            outputJsonFile.text = outputJsonFile.text.replace("-enable-native-access=ALL-UNNAMED", "--enable-native-access=ALL-UNNAMED")

            if((platform == "Windows64")){
                copy{
                    from "build/packr/output/jre/bin/msvcr100.dll"
                    into "build/packr/output/"
                    rename("msvcr100.dll", "MSVCR100.dll")
                }
            }

            if(versionModifier.contains("steam")){
                copy{
                    def lib = platform == "MacOS" || platform == "Linux64" ? "lib" : ""
                    from zipTree(platform == "MacOS" ? "build/packr/output/${appName}.app/Contents/Resources/desktop.jar" : "build/packr/output/jre/desktop.jar").matching{
                        include "${lib}frogworks${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                        include "${lib}steam_api${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                    }
                    into platform != "MacOS" ? "build/packr/output/" : "build/packr/output/${appName}.app/Contents/Resources"
                }
            }

            copy{
                from "build/packr/output"
                into "../deploy/${platform.toString()}"
            }
        }

        task "zip${platform.toString()}"(type: Zip){
            from "build/packr/output"
            archiveFileName = "${generateDeployName(platform.toString())}.zip"
            destinationDirectory = (file("../deploy"))

            doLast{
                delete{
                    delete "build/packr/"
                }
            }
        }

        finalizedBy "zip${platform.toString()}"

    }
}
